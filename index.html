<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>burn-this-cloth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
</head>
<body>
  <button class="menu-toggle hidden" id="menuToggle" title="show menu">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4H14M2 8H14M2 12H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="panel" id="panel">
    <div class="panel-head" id="panelHead">
      <div class="panel-title">burn<span>-this-</span>cloth</div>
      <button class="panel-close" id="panelClose" title="hide">&times;</button>
    </div>
    <div class="panel-body">
      <div class="panel-hint">
        Hover anywhere on the image to push the cloth. Click a spot to set it on fire.
        Hover the cloth's own frame for quick tools -- load/remove image, density, mesh.
      </div>
      <div class="panel-row">
        <button id="resetBtn">Reset State</button>
      </div>

      <div class="panel-label">Anchor points</div>
      <div class="anchor-group">
        <button type="button" class="anchor-btn active" data-anchor="edge">Top</button>
        <button type="button" class="anchor-btn" data-anchor="three">3 pt</button>
        <button type="button" class="anchor-btn" data-anchor="eight">8 pt</button>
      </div>

      <div class="panel-label">Canvas size</div>
      <div class="preset-group" id="presetRow">
        <button type="button" class="preset-btn" data-preset="square">1:1</button>
        <button type="button" class="preset-btn" data-preset="portrait">4:5</button>
        <button type="button" class="preset-btn" data-preset="story">9:16</button>
      </div>

      <div class="panel-label">Custom size</div>
      <div class="size-note">Capped at 4K per side</div>
      <div class="panel-row">
        <div class="field-pair">
          <input type="number" id="widthInput" placeholder="W" min="1" step="1" />
          <input type="number" id="heightInput" placeholder="H" min="1" step="1" />
          <button type="button" id="applySizeBtn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage">
      <canvas id="c"></canvas>

      <!-- Thin rectangle traced around the cloth on hover, gapped off
           the cloth's real edges so it never reads as part of the
           image itself. The toolbar is nested inside it so it can
           anchor itself to the rectangle's own top edge in CSS
           (see .cloth-toolbar) rather than needing its own JS math. -->
      <div class="cloth-frame" id="clothFrame">
        <div class="cloth-toolbar" id="clothToolbar">
          <label class="cloth-tool-btn file-btn" id="loadImageBtn" title="Load image">
            Load
            <input type="file" id="fileInput" accept="image/*" />
          </label>
          <button type="button" id="removeImageBtn" class="cloth-tool-btn" title="Remove image">Remove</button>
          <button type="button" id="densityBtn" class="cloth-tool-btn">Density</button>
          <button type="button" id="gridToggleBtn" class="cloth-tool-btn">Mesh</button>
          <button type="button" id="clothCloseBtn" class="cloth-tool-btn cloth-close-btn" title="Close panel">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
